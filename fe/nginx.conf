server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets generated by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon
    location = /logo.svg {
        try_files $uri =404;
    }

    # Optional: disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Optional: gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}