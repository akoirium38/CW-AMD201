name: API Gateway CI

on:
  push:
    branches: [master]
    paths:
      - 'Gateway/**'
      - '.github/workflows/gateway.yml'

  pull_request:
    branches: [master]
    paths:
      - 'Gateway/**'

jobs:

  build:
    name: Build API Gateway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Gateway/APIGateway.csproj

      - name: Build
        run: dotnet build Gateway/APIGateway.csproj --configuration Release --no-restore

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t api-gateway ./Gateway

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_GATEWAY_DEPLOY_HOOK }}