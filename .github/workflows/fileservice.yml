name: FileService CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'FileService.API/**'
      - 'FileService.Tests/**'
      - '.github/workflows/fileservice.yml'

  pull_request:
    branches: [master]
    paths:
      - 'FileService.API/**'
      - 'FileService.Tests/**'

jobs:

  build:
    name: Build FileService
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FileService.API/FileService.API.csproj

      - name: Build
        run: dotnet build FileService.API/FileService.API.csproj --configuration Release --no-restore

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Test Project
        run: dotnet restore FileService.Tests/FileService.Tests.csproj

      - name: Run Tests
        run: dotnet test FileService.Tests/FileService.Tests.csproj --configuration Release

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t fileservice-api ./FileService.API

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_FILESERVICE_DEPLOY_HOOK }}