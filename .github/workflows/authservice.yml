name: AuthService CI

on:
  push:
    branches: [main]
    paths:
      - 'AuthService.API/**'
      - 'AuthService.Tests/**'
      - '.github/workflows/authservice.yml'

  pull_request:
    branches: [main]
    paths:
      - 'AuthService.API/**'
      - 'AuthService.Tests/**'

jobs:

  build:
    name: Build AuthService
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AuthService.API/AuthService.API.csproj

      - name: Build
        run: dotnet build AuthService.API/AuthService.API.csproj --configuration Release --no-restore

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Test Project
        run: dotnet restore AuthService.Tests/AuthService.Tests.csproj

      - name: Run Tests
        run: dotnet test AuthService.Tests/AuthService.Tests.csproj --configuration Release

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t authservice-api ./AuthService.API